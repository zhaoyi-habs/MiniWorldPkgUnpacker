<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>迷你世界 · 远程操控台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:17px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#3fb950;box-shadow:0 0 8px #3fb950}
.dot.off{background:#f85149;box-shadow:0 0 8px #f85149}
.dot.wait{background:#d29922;box-shadow:0 0 8px #d29922}
.sub{font-size:11px;color:#7d8590;margin-bottom:12px}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px;margin-bottom:12px}
label{font-size:11px;color:#7d8590;display:block;margin-bottom:4px}
input,select{width:100%;background:#0d1117;border:1px solid #30363d;color:#e6edf3;border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:#388bfd}
.row{display:flex;gap:8px;margin-bottom:8px}
.row>*{flex:1}
button{background:#21262d;border:1px solid #30363d;color:#e6edf3;border-radius:6px;padding:9px 12px;font-size:13px;cursor:pointer;font-family:inherit}
button:hover{background:#30363d}
button.pri{background:#238636;border-color:#2ea043;color:#fff;font-weight:500}
button.pri:hover{background:#2ea043}
.screen-wrap{position:relative;background:#000;border-radius:10px;overflow:hidden;border:1px solid #30363d;display:flex;justify-content:center;align-items:center;min-height:200px}
#screen{display:block;max-width:100%;cursor:crosshair;-webkit-user-select:none;user-select:none}
#screen.hidden{display:none}
.ph{color:#484f58;font-size:12px;padding:20px;text-align:center}
.ripple{position:absolute;width:36px;height:36px;border:2px solid #58a6ff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:rip .5s ease-out forwards}
@keyframes rip{from{opacity:1;transform:translate(-50%,-50%) scale(.3)}to{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.toolbar button{flex:1;min-width:60px;font-size:12px;padding:7px 6px}
.status{display:flex;justify-content:space-between;font-size:11px;color:#7d8590;padding:6px 0;flex-wrap:wrap;gap:6px}
.status b{color:#e6edf3;font-weight:500}
.elist{max-height:220px;overflow-y:auto}
.eitem{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;background:#0d1117;border:1px solid #30363d;border-radius:6px;margin-bottom:5px;cursor:pointer;font-size:12px}
.eitem:hover{background:#1c2128;border-color:#388bfd}
.eitem .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px}
.eitem .c{color:#7d8590;font-size:11px;font-family:ui-monospace,monospace;white-space:nowrap}
.eitem .b{width:6px;height:6px;border-radius:50%;background:#3fb950;margin-right:7px;flex-shrink:0}
.eitem .b.n{background:#484f58}
.hint{font-size:11px;color:#7d8590;background:#0d1117;border-left:2px solid #d29922;padding:8px 10px;border-radius:4px;margin-top:8px}
.log{font-family:ui-monospace,monospace;font-size:11px;color:#7d8590;max-height:110px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1><span class="dot off" id="dot"></span>迷你世界 · 远程操控台</h1>
<div class="sub">点屏幕 = 模拟器点击该位置</div>

<div class="card" id="setup">
  <label>GitHub Token（需 repo 权限）</label>
  <input type="password" id="tok" placeholder="ghp_xxxx..." autocomplete="off">
  <div class="row" style="margin-top:8px">
    <div><label>Owner</label><input id="own" value="zhaoyi-habs" autocomplete="off"></div>
    <div><label>仓库名</label><input id="rep" value="MiniWorldPkgUnpacker" autocomplete="off"></div>
  </div>
  <div class="row">
    <div><label>刷新间隔</label>
      <select id="iv">
        <option value="8000">8 秒（推荐）</option>
        <option value="12000" selected>12 秒（稳）</option>
        <option value="20000">20 秒（省）</option>
        <option value="0">手动</option>
      </select>
    </div>
    <div><label>设备方向</label>
      <select id="res">
        <option value="1920x1080" selected>横屏 1920×1080</option>
        <option value="1080x1920">竖屏 1080×1920</option>
      </select>
    </div>
  </div>
  <button class="pri" style="width:100%;margin-top:4px" onclick="connect()">连接模拟器</button>
  <div class="hint">每轮 = 发截图命令 + 等模拟器渲染(约5秒) + 读回。选太短只会堆积失败。<br>Token 只存本地浏览器。</div>
</div>

<div id="main" class="hidden">
  <div class="card" style="padding:8px">
    <div class="screen-wrap" id="swrap">
      <div class="ph" id="ph">加载画面中…</div>
      <img id="screen" class="hidden" alt="屏幕">
    </div>
    <div class="toolbar">
      <button onclick="send('key KEYCODE_BACK')">◀ 返回</button>
      <button onclick="send('key KEYCODE_HOME')">● 主页</button>
      <button onclick="send('key KEYCODE_APP_SWITCH')">▣ 任务</button>
      <button onclick="forceRefresh()">⟳ 刷新</button>
      <button onclick="loadUI()">☰ 元素</button>
    </div>
    <div class="status">
      <span>延迟 <b id="lat">-</b></span>
      <span>更新 <b id="age">-</b></span>
      <span>设备 <b id="dv">-</b></span>
      <span>失败 <b id="errn">0</b></span>
    </div>
  </div>

  <div class="card hidden" id="uicard">
    <label>界面元素（点击即触发）</label>
    <div class="elist" id="elist"></div>
  </div>

  <div class="card">
    <div class="row">
      <button id="auto" class="pri" onclick="toggleAuto()">⏸ 暂停实时</button>
      <button onclick="disconnect()">断开</button>
    </div>
    <div class="log" id="log"></div>
  </div>
</div>
</div>

<script>
let T='',OWN='',REP='',DEV=[1920,1080],IV=4000,AUTO=true;
let timer=null,lastTs=0,lastFetch=0,busy=false,errN=0,failStreak=0,SHOT_WAIT=5000;

const $=i=>document.getElementById(i);
function log(m){const e=$('log');e.textContent=(new Date().toTimeString().slice(0,8)+' '+m+'\n')+e.textContent;e.textContent=e.textContent.slice(0,2500);}
function raw(p){return `https://raw.githubusercontent.com/${OWN}/${REP}/main/${p}?t=${Date.now()}`;}
function setDot(c){$('dot').className='dot '+(c||'');}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function api(path,opt={}){
  const r=await fetch(`https://api.github.com/repos/${OWN}/${REP}/contents/${path}`,{
    ...opt,headers:{Authorization:'Bearer '+T,'User-Agent':'mw-remote','Content-Type':'application/json',...(opt.headers||{})}
  });
  return {ok:r.ok,status:r.status,json:await r.json().catch(()=>null)};
}
// 写：带 409 冲突重试（重新取 sha 再来）
async function put(path,content,tries=3){
  const enc=btoa(unescape(encodeURIComponent(content)));
  for(let i=0;i<tries;i++){
    const g=await api(path);
    const sha=(g.ok&&g.json)?g.json.sha:null;
    const body={message:'remote',content:enc};
    if(sha)body.sha=sha;
    const r=await api(path,{method:'PUT',body:JSON.stringify(body)});
    if(r.ok)return true;
    if(r.status===409){await sleep(300*(i+1));continue;}
    throw new Error(path+' HTTP '+r.status);
  }
  throw new Error(path+' 409 冲突（重试'+tries+'次仍失败）');
}
async function rd(p){
  const r=await fetch(raw(p),{cache:'no-store'});
  if(!r.ok)throw new Error(p+' HTTP '+r.status);
  return r.text();
}

function connect(){
  T=$('tok').value.trim();OWN=$('own').value.trim();REP=$('rep').value.trim();
  if(!T){alert('请填 Token');return;}
  DEV=$('res').value.split('x').map(Number);
  IV=parseInt($('iv').value);
  localStorage.setItem('mw_tok',T);localStorage.setItem('mw_own',OWN);localStorage.setItem('mw_rep',REP);
  $('dv').textContent=DEV[0]+'×'+DEV[1];
  $('setup').classList.add('hidden');$('main').classList.remove('hidden');
  log('已连接，加载画面…');
  loop();
}
function disconnect(){clearTimeout(timer);setDot('off');$('main').classList.add('hidden');$('setup').classList.remove('hidden');}
function toggleAuto(){
  AUTO=!AUTO;
  $('auto').textContent=AUTO?'⏸ 暂停实时':'▶ 开启实时';
  clearTimeout(timer);
  if(AUTO)loop();
}
// 串行循环：上一次跑完才排下一次，绝不堆积
async function loop(){
  if(!AUTO)return;
  await refresh();
  if(!AUTO)return;
  const wait=IV+(failStreak>2?failStreak*2000:0);
  timer=setTimeout(loop,wait);
}

async function refresh(){
  if(busy)return;busy=true;setDot('wait');
  const t0=Date.now();
  try{
    // 关键：主动命令模拟器截一张新图，否则画面永远是旧的
    await put('relay/mw_cmd.txt','shot',2);
    await sleep(SHOT_WAIT);
    let ts=0,b64='',mime='image/jpeg';
    // 新格式：单文件 latest.txt（首行时间戳，次行 base64）
    try{
      const txt=await rd('relay/latest.txt');
      const nl=txt.indexOf('\n');
      ts=parseInt(txt.slice(0,nl).trim())||0;
      b64=txt.slice(nl+1).replace(/\s/g,'');
    }catch(e){
      // 回退旧分片格式
      const meta=JSON.parse(await rd('relay/mw_shot_meta.json'));
      ts=meta.ts||0;mime='image/png';
      let s='';
      for(let i=0;i<(meta.chunks||1);i++)s+=await rd(`relay/mw_shot_${i}.b64`);
      b64=s.replace(/\s/g,'');
    }
    if(ts&&ts===lastTs){busy=false;setDot('');failStreak=0;return;}
    const img=$('screen');
    await new Promise((res,rej)=>{
      img.onload=()=>{img.classList.remove('hidden');$('ph').classList.add('hidden');
        if(img.naturalWidth>img.naturalHeight)DEV=[1920,1080];else DEV=[1080,1920];
        $('dv').textContent=DEV[0]+'×'+DEV[1];res();};
      img.onerror=()=>rej(new Error('图片解码失败'));
      img.src=`data:${mime};base64,`+b64;
    });
    lastTs=ts;lastFetch=Date.now();failStreak=0;
    $('lat').textContent=(Date.now()-t0)+'ms';
    setDot('');
  }catch(e){
    errN++;failStreak++;$('errn').textContent=errN;
    if(errN<=3||errN%10===0)log('✗ '+e.message);
    setDot('off');
  }
  busy=false;
}
function forceRefresh(){lastTs=0;if(!busy)refresh();}

$('screen').addEventListener('click',function(e){
  const r=this.getBoundingClientRect();
  const x=Math.round((e.clientX-r.left)/r.width*DEV[0]);
  const y=Math.round((e.clientY-r.top)/r.height*DEV[1]);
  const rp=document.createElement('div');rp.className='ripple';
  rp.style.left=(e.clientX-r.left)+'px';rp.style.top=(e.clientY-r.top)+'px';
  $('swrap').appendChild(rp);setTimeout(()=>rp.remove(),600);
  send(`tap ${x} ${y}`);
});

async function send(cmd){
  try{
    await put('relay/mw_cmd.txt',cmd);
    log('▶ '+cmd);
    setTimeout(()=>{lastTs=0;if(!busy)refresh();},1200);
  }catch(e){log('✗ '+e.message);}
}

async function loadUI(){
  const c=$('uicard');
  if(c.dataset.open==='1'){c.classList.add('hidden');c.dataset.open='0';return;}
  try{
    await put('relay/mw_cmd.txt','ui');
    log('▶ 解析界面元素…');
    for(let i=0;i<25;i++){
      await sleep(800);
      const res=await rd('relay/mw_res.txt');
      if(res.startsWith('OK|ui|')){
        renderUI(JSON.parse(res.slice(7)));
        c.classList.remove('hidden');c.dataset.open='1';return;
      }
    }
    log('✗ 元素解析超时');
  }catch(e){log('✗ '+e.message);}
}
function renderUI(items){
  const el=$('elist');el.innerHTML='';
  items.forEach(it=>{
    const d=document.createElement('div');d.className='eitem';
    d.innerHTML=`<span class="b ${it.btn?'':'n'}"></span><span class="t">${esc(it.t)}</span><span class="c">${it.x},${it.y}</span>`;
    d.onclick=()=>send(`tap ${it.x} ${it.y}`);
    el.appendChild(d);
  });
  log('元素 '+items.length+' 个');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

setInterval(()=>{if(lastFetch)$('age').textContent=Math.round((Date.now()-lastFetch)/1000)+'s前';},1000);
window.onload=()=>{
  const t=localStorage.getItem('mw_tok');
  if(t){$('tok').value=t;$('own').value=localStorage.getItem('mw_own')||'zhaoyi-habs';$('rep').value=localStorage.getItem('mw_rep')||'MiniWorldPkgUnpacker';}
};
</script>
</body>
</html>
