name: Fetch2

on:
  workflow_dispatch:
    inputs:
      pat:
        description: PAT
        required: true
      rel_id:
        description: release id
        required: true

permissions:
  contents: write

jobs:
  f:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Fetch upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAT: ${{ github.event.inputs.pat }}
          REL_ID: ${{ github.event.inputs.rel_id }}
        run: |
          mkdir -p relay
          cat > relay/fetch2.py <<'PYEOF'
          #!/usr/bin/env python3
          """runner 侧：并发下载 APK -> 校验 -> 上传到 GitHub Release（持久）
          关键：URL 用 imtt.dd.qq.com（不是 imtt2），该域名实测返回 206 支持 Range。
          """
          import os, sys, json, time, base64, subprocess, urllib.request, urllib.error
          from concurrent.futures import ThreadPoolExecutor, as_completed

          TOKEN = os.environ.get("GH_TOKEN", "")
          PAT = os.environ.get("PAT", "")          # 有 workflow/repo 权限，用于上传
          STORE = os.environ.get("STORE", "zhaoyi-habs/mw-apk-store")
          REL_ID = os.environ.get("REL_ID", "")
          REPO = os.environ.get("GITHUB_REPOSITORY", "")

          URL = ("https://imtt.dd.qq.com/sjy.00009/sjy.00002/16891/apk/"
                 "0F94B1CB324EE4F471C95BA1127CE377.apk"
                 "?fsname=com.tencent.tmgp.minitech.miniworld_80640.apk")
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
          SRC = "/tmp/mw.apk"
          PDIR = "/tmp/parts"
          NWORK = 24
          NCHUNK = 48


          def report(msg):
              try:
                  path = f"/repos/{REPO}/contents/relay/result.txt"
                  req = urllib.request.Request("https://api.github.com" + path)
                  req.add_header("Authorization", "Bearer " + TOKEN)
                  req.add_header("User-Agent", "r")
                  sha = None
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          sha = json.loads(r.read().decode()).get("sha")
                  except Exception:
                      pass
                  p = {"message": "progress", "content": base64.b64encode(msg.encode()).decode()}
                  if sha:
                      p["sha"] = sha
                  req2 = urllib.request.Request("https://api.github.com" + path, method="PUT")
                  req2.add_header("Authorization", "Bearer " + TOKEN)
                  req2.add_header("User-Agent", "r")
                  req2.add_header("Content-Type", "application/json")
                  urllib.request.urlopen(req2, json.dumps(p).encode(), timeout=90).read()
              except Exception as e:
                  print("report fail:", e)


          def get_size():
              r = subprocess.run(["curl", "-sI", "-m", "40", "-A", UA, URL],
                                 capture_output=True, text=True)
              for line in (r.stdout or "").splitlines():
                  if line.lower().startswith("content-length:"):
                      return int(line.split(":")[1].strip())
              return 0


          def cp(i):
              return os.path.join(PDIR, "p%03d" % i)


          def fetch(task):
              i, s, e = task
              expect = e - s + 1
              for attempt in range(6):
                  try:
                      subprocess.run(["curl", "-s", "-m", "900", "-A", UA,
                                      "-r", f"{s}-{e}", "-o", cp(i), URL], timeout=920)
                  except subprocess.TimeoutExpired:
                      pass
                  if os.path.exists(cp(i)) and os.path.getsize(cp(i)) == expect:
                      return i, True
                  time.sleep(2 * (attempt + 1))
              return i, False


          def main():
              out = []
              os.makedirs(PDIR, exist_ok=True)

              size = get_size()
              out.append(f"=== probe ===\nsize={size} ({size/1048576:.1f}MB)")
              report("\n".join(out))
              if size < 1024:
                  out.append("无法获取大小"); report("\n".join(out)); return 1

              step = (size + NCHUNK - 1) // NCHUNK
              tasks, pos, i = [], 0, 0
              while pos < size:
                  e = min(pos + step - 1, size - 1)
                  tasks.append((i, pos, e)); pos = e + 1; i += 1
              out.append(f"chunks={len(tasks)} x {step//1048576}MB, workers={NWORK}")
              report("\n".join(out))

              t0 = time.time()
              fails, n = [], 0
              with ThreadPoolExecutor(max_workers=NWORK) as ex:
                  futs = [ex.submit(fetch, t) for t in tasks]
                  for f in as_completed(futs):
                      i, ok = f.result()
                      n += 1
                      if not ok:
                          fails.append(i)
                      if n % 6 == 0 or n == len(tasks):
                          got = sum(os.path.getsize(cp(j)) for j, s, e in tasks
                                    if os.path.exists(cp(j)))
                          el = time.time() - t0
                          sp = got / 1048576 / el if el else 0
                          line = (f"  [{n}/{len(tasks)}] {got/1048576:.0f}MB "
                                  f"{got*100//size}% | {sp:.2f}MB/s")
                          out.append(line)
                          report("\n".join(out))
              out.append(f"download done in {(time.time()-t0)/60:.1f} min, fails={fails}")
              report("\n".join(out))
              if fails:
                  out.append("有块失败，中止"); report("\n".join(out)); return 1

              # 合并
              out.append("=== merge ===")
              with open(SRC, "wb") as o:
                  for j, s, e in tasks:
                      with open(cp(j), "rb") as f:
                          while True:
                              b = f.read(1 << 20)
                              if not b:
                                  break
                              o.write(b)
              total = os.path.getsize(SRC)
              out.append(f"merged={total} ({total/1048576:.1f}MB) match={total == size}")
              import zipfile
              try:
                  z = zipfile.ZipFile(SRC)
                  names = z.namelist()
                  out.append(f"zip OK entries={len(names)}")
                  for k in ("AndroidManifest.xml", "resources.arsc", "classes.dex"):
                      out.append(f"  {'OK' if k in names else 'MISSING'} {k}")
              except Exception as e:
                  out.append(f"zip FAIL {type(e).__name__}")
              report("\n".join(out))
              if total != size:
                  out.append("大小不符，中止上传"); report("\n".join(out)); return 1

              # 上传到 Release
              out.append("=== upload to release ===")
              up = f"https://uploads.github.com/repos/{STORE}/releases/{REL_ID}/assets"
              t1 = time.time()
              r = subprocess.run(
                  ["curl", "-s", "-m", "5400", "-X", "POST",
                   "-H", f"Authorization: Bearer {PAT}",
                   "-H", "Content-Type: application/octet-stream",
                   "--data-binary", f"@{SRC}",
                   up + "?name=miniworld_1.59.0.apk"],
                  capture_output=True, text=True, timeout=5500)
              try:
                  d = json.loads(r.stdout or "{}")
                  if "id" in d:
                      out.append(f"uploaded id={d['id']} size={d.get('size')} "
                                 f"in {(time.time()-t1)/60:.1f} min")
                      out.append(f"download_url={d.get('browser_download_url')}")
                  else:
                      out.append("upload FAIL: " + json.dumps(d)[:300])
              except Exception:
                  out.append("upload resp: " + (r.stdout or "")[:300])
              out.append(f"TOTAL {(time.time()-t0)/60:.1f} min")
              report("\n".join(out))
              print("\n".join(out))
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          python3 relay/fetch2.py
