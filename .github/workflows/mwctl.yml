name: MwCtl

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Cache SDK
        uses: actions/cache@v4
        with:
          path: /home/runner/android-sdk
          key: android-sdk-v2
      - name: Cache APK
        uses: actions/cache@v4
        with:
          path: /home/runner/mw.apk
          key: mw-apk-v1
      - name: Resident
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          sudo apt-get install -y -qq python3-pil 2>&1 | tail -1 || true
          mkdir -p relay
          cat > relay/mwctl.py <<'PYEOF'
          #!/usr/bin/env python3
          """常驻控制器：模拟器只启动一次，之后 0.25s 轮询命令，秒级响应"""
          import os, sys, json, time, base64, subprocess, urllib.request, re, traceback

          TOKEN=os.environ.get("GH_TOKEN",""); REPO=os.environ.get("GITHUB_REPOSITORY","")
          HOME=os.path.expanduser("~"); SDK=f"{HOME}/android-sdk"
          PKG="com.tencent.tmgp.minitech.miniworld"
          adb=f"{SDK}/platform-tools/adb"; emu=f"{SDK}/emulator/emulator"
          sm=f"{SDK}/cmdline-tools/latest/bin/sdkmanager"
          CMD=f"relay/mw_cmd.txt"; RES=f"relay/mw_res.txt"
          DEADLINE=time.time()+5.5*3600

          def rep(path,msg):
              try:
                  req=urllib.request.Request(f"https://api.github.com/repos/{REPO}/contents/{path}")
                  req.add_header("Authorization","Bearer "+TOKEN); req.add_header("User-Agent","r")
                  sha=None
                  try:
                      with urllib.request.urlopen(req,timeout=20) as r: sha=json.loads(r.read().decode()).get("sha")
                  except Exception: pass
                  p={"message":"ctl","content":base64.b64encode(msg.encode()).decode()}
                  if sha: p["sha"]=sha
                  r2=urllib.request.Request(f"https://api.github.com/repos/{REPO}/contents/{path}",method="PUT")
                  r2.add_header("Authorization","Bearer "+TOKEN); r2.add_header("User-Agent","r")
                  r2.add_header("Content-Type","application/json")
                  urllib.request.urlopen(r2,json.dumps(p).encode(),timeout=60).read(); return True
              except Exception: return False

          def get(path):
              try:
                  req=urllib.request.Request(f"https://api.github.com/repos/{REPO}/contents/{path}")
                  req.add_header("Authorization","Bearer "+TOKEN); req.add_header("User-Agent","r")
                  req.add_header("If-None-Match", getattr(get,"_etag_"+path.replace('/','_'),""))
                  with urllib.request.urlopen(req,timeout=20) as r:
                      j=json.loads(r.read().decode())
                      setattr(get,"_etag_"+path.replace('/','_'), r.headers.get("ETag",""))
                      return base64.b64decode(j["content"]).decode("utf-8","replace")
              except urllib.error.HTTPError as e:
                  if e.code==304: return None
                  return None
              except Exception: return None

          def sh(c,t=600):
              try:
                  r=subprocess.run(c,shell=True,capture_output=True,text=True,timeout=t)
                  return (r.stdout or "")+"\n"+(r.stderr or "")
              except subprocess.TimeoutExpired: return "TIMEOUT"

          log=[]
          def L(s):
              log.append(s); print(s,flush=True)
              rep("relay/mw_log.txt","\n".join(log[-80:]))

          # ---------- 启动 ----------
          L("=== 启动模拟器 ===")
          sd=None
          for root,dirs,files in os.walk(f"{SDK}/system-images"):
              if "android-30" in root and "kernel-ranchu" in files: sd=root+"/"; break
          if not sd:
              L("无镜像，安装中")
              sh(f"yes | {sm} --sdk_root={SDK} --licenses >/dev/null 2>&1",900)
              sh(f"{sm} --sdk_root={SDK} --install 'platform-tools' 'emulator' 'system-images;android-30;google_apis_playstore;x86_64' 2>&1|tail -2",2400)
              for root,dirs,files in os.walk(f"{SDK}/system-images"):
                  if "android-30" in root and "kernel-ranchu" in files: sd=root+"/"; break
          L("sd="+str(sd))
          if not sd: L("ABORT"); sys.exit(1)

          AVD="mw30"; avdd=f"{HOME}/.android/avd/{AVD}.avd"
          os.makedirs(avdd,exist_ok=True)
          open(f"{HOME}/.android/avd/{AVD}.ini","w").write(
              f"avd.ini.encoding=UTF-8\npath={avdd}\npath.rel=avd/{AVD}.avd\ntarget=android-30\n")
          open(f"{avdd}/config.ini","w").write(f"""AvdId={AVD}
          PlayStore.enabled=false
          abi.type=x86_64
          avd.ini.displayname={AVD}
          avd.ini.encoding=UTF-8
          disk.dataPartition.size=14G
          hw.audioInput=no
          hw.audioOutput=no
          hw.cpu.arch=x86_64
          hw.cpu.ncore=4
          hw.gpu.enabled=yes
          hw.gpu.mode=angle_indirect
          hw.keyboard=yes
          hw.lcd.density=420
          hw.lcd.height=1080
          hw.lcd.width=1920
          hw.mainKeys=no
          hw.ramSize=8192
          image.sysdir.1={sd}
          runtime.network.latency=none
          runtime.network.speed=full
          showDeviceFrame=no
          tag.id=google_apis_playstore
          """)
          sh("sudo chmod 666 /dev/kvm 2>&1||true",60)
          sh("pkill -f qemu-system; sleep 3",60)
          sh(f"rm -f {avdd}/*.lock 2>/dev/null",60)
          sh(f"nohup {emu} -avd {AVD} -no-window -no-audio -no-boot-anim -gpu angle_indirect "
             f"-no-snapshot -memory 8192 -cores 4 -partition-size 8192 -qemu -enable-kvm "
             f"> {HOME}/ctl.log 2>&1 &",60)
          ok=False
          for i in range(45):
              time.sleep(10)
              if sh(f"{adb} shell getprop sys.boot_completed 2>&1|tr -d '\\r\\n'",30).strip()=="1":
                  ok=True; L(f"booted"); break
          if not ok: L("BOOT FAIL:"+sh(f"tail -20 {HOME}/ctl.log").strip()[-800:]); sys.exit(1)

          if PKG not in sh(f"{adb} shell pm list packages 2>&1",60):
              APK=f"{HOME}/mw.apk"
              if not os.path.exists(APK) or os.path.getsize(APK)<1000000:
                  L("下载APK")
                  sh(f"curl -sL -m 1800 -A 'Mozilla/5.0' -o {APK} "
                     "'https://imtt.dd.qq.com/sjy.00009/sjy.00002/16891/apk/0F94B1CB324EE4F471C95BA1127CE377.apk?fsname=com.tencent.tmgp.minitech.miniworld_80640.apk'",1800)
              L("install: "+sh(f"{adb} install -r -t {APK} 2>&1|tail -2",2400).strip()[-200:])
          sh(f"{adb} shell am start -n {PKG}/com.minitech.miniworld.StartupActivity 2>&1|tail -1",180)
          L("READY")
          rep(RES, "READY|0")

          def ui():
              sh(f"{adb} shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1",60)
              xml=sh(f"{adb} shell cat /sdcard/ui.xml 2>/dev/null",60)
              items=[]
              for m in re.finditer(r'<node[^>]*>', xml):
                  tag=m.group(0)
                  def g(k):
                      mm=re.search(k+r'="([^"]*)"',tag); return mm.group(1) if mm else ""
                  t=g("text")
                  if not t or "&#10;" in t or len(t)>30: continue
                  b=g("bounds"); bm=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',b)
                  if not bm: continue
                  x1,y1,x2,y2=map(int,bm.groups())
                  items.append({"t":t,"x":(x1+x2)//2,"y":(y1+y2)//2,
                                "btn": ("Button" in g("class")) or g("clickable")=="true"})
              return items

          def shot():
              png=f"{HOME}/s_{int(time.time())}.png"
              sh(f"{adb} exec-out screencap -p > {png}",90)
              if not os.path.exists(png) or os.path.getsize(png)<1000: return None,None
              try:
                  from PIL import Image
                  import io
                  im=Image.open(png).convert("RGB")
                  w,h=im.size
                  if w>900: im=im.resize((900,int(h*900/w)))
                  b=io.BytesIO(); im.save(b,"PNG",optimize=True); raw=b.getvalue()
                  return raw, im.size
              except Exception:
                  return open(png,'rb').read(), None

          # ---------- 常驻循环 ----------
          L("=== 常驻监听 ===")
          last=""
          n=0
          while time.time() < DEADLINE:
              try:
                  c = get(CMD)
                  if c and c.strip() and c.strip()!=last:
                      last=c.strip()
                      parts=c.strip().split()
                      op=parts[0]; L(f"CMD: {c.strip()}")
                      t0=time.time()
                      if op=="shot":
                          raw,size=shot()
                          if raw:
                              b=base64.b64encode(raw).decode()
                              CH=280000; k=(len(b)+CH-1)//CH
                              for i in range(min(k,10)):
                                  rep(f"relay/mw_shot_{i}.b64", b[i*CH:(i+1)*CH])
                              rep("relay/mw_shot_meta.json", json.dumps({"chunks":min(k,10),"size":str(size)}))
                              rep(RES, f"OK|shot|{len(raw)}|{(time.time()-t0)*1000:.0f}ms")
                          else: rep(RES,"FAIL|shot")
                      elif op=="ui":
                          items=ui()
                          rep(RES, "OK|ui|"+json.dumps(items, ensure_ascii=False))
                      elif op=="tap" and len(parts)>=3:
                          sh(f"{adb} shell input tap {parts[1]} {parts[2]} 2>&1",30)
                          rep(RES, f"OK|tap|{parts[1]},{parts[2]}")
                      elif op=="key":
                          sh(f"{adb} shell input keyevent {parts[1]}",30)
                          rep(RES,"OK|key")
                      elif op=="start":
                          sh(f"{adb} shell am start -n {PKG}/com.minitech.miniworld.StartupActivity 2>&1|tail -1",120)
                          rep(RES,"OK|start")
                      elif op=="click" and len(parts)>=2:
                          want=" ".join(parts[1:])
                          for it in ui():
                              if want in it["t"]:
                                  sh(f"{adb} shell input tap {it['x']} {it['y']} 2>&1",30)
                                  rep(RES, f"OK|click|{it['t']}@{it['x']},{it['y']}")
                                  break
                          else: rep(RES, f"MISS|click|{want}")
                      elif op=="shell":
                          r=sh(" ".join(parts[1:]),180)
                          rep(RES,"OK|shell|"+r.strip()[-600:])
                      elif op=="inst" and len(parts)>=2:
                          url=parts[1]; apk=f"{HOME}/extra.apk"
                          d=sh(f"curl -sL -m 900 -A 'Mozilla/5.0' -o {apk} '{url}'",900)
                          sz=os.path.getsize(apk) if os.path.exists(apk) else 0
                          r=sh(f"{adb} install -r -t {apk} 2>&1|tail -3",1800)
                          rep(RES,f"OK|inst|size={sz}|"+r.strip()[-300:])
                      else:
                          rep(RES,"ERR|unknown")
                  time.sleep(0.25)
              except Exception:
                  L("loop err: "+traceback.format_exc()[-300:])
                  time.sleep(1)
          L("EXIT")
          PYEOF
          python3 relay/mwctl.py || true
