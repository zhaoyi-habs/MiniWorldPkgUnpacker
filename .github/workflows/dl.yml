name: Download Probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Probe APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p relay
          cat > relay/dl.py <<'PYEOF'
          #!/usr/bin/env python3
          """一次性下载任务：下载 -> 写回大小和版本到 relay/result.txt"""
          import os, sys, json, time, base64, subprocess, urllib.request

          TOKEN = os.environ.get("GH_TOKEN", "")
          REPO = os.environ.get("GITHUB_REPOSITORY", "")

          def api(path, method="GET", data=None):
              req = urllib.request.Request("https://api.github.com" + path, method=method)
              req.add_header("Authorization", "Bearer " + TOKEN)
              req.add_header("User-Agent", "dl")
              req.add_header("Accept", "application/vnd.github+json")
              body = None
              if data is not None:
                  body = json.dumps(data).encode()
                  req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req, body, timeout=30) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.loads(e.read().decode())
                  except Exception:
                      return e.code, None
              except Exception as e:
                  return -1, None

          def write_file(path, content):
              b64 = base64.b64encode(content.encode()).decode()
              st, d = api(f"/repos/{REPO}/contents/{path}")
              sha = d.get("sha") if d else None
              p = {"message": "dl", "content": b64}
              if sha: p["sha"] = sha
              st2, _ = api(f"/repos/{REPO}/contents/{path}", "PUT", p)
              return st2 in (200, 201)

          URL = ("http://imtt2.dd.qq.com/sjy.00009/sjy.00002/16891/apk/"
                 "0F94B1CB324EE4F471C95BA1127CE377.apk"
                 "?fsname=com.tencent.tmgp.minitech.miniworld_80640.apk")

          out = []
          out.append("=== 跟随重定向 HEAD ===")
          r = subprocess.run(["curl","-sIL","-m","40","-A","Mozilla/5.0",URL],
                             capture_output=True, text=True)
          out.append((r.stdout or "")[:1500])
          write_file("relay/result.txt", "\n".join(out))
          print("\n".join(out))
          PYEOF
          python3 relay/dl.py
