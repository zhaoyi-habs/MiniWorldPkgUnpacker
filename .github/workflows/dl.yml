name: Download Probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Download APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p relay
          cat > relay/dl.py <<'PYEOF'
          #!/usr/bin/env python3
          """一次性下载任务：下载 -> 写回大小和版本到 relay/result.txt"""
          import os, sys, json, time, base64, subprocess, urllib.request

          TOKEN = os.environ.get("GH_TOKEN", "")
          REPO = os.environ.get("GITHUB_REPOSITORY", "")

          def api(path, method="GET", data=None):
              req = urllib.request.Request("https://api.github.com" + path, method=method)
              req.add_header("Authorization", "Bearer " + TOKEN)
              req.add_header("User-Agent", "dl")
              req.add_header("Accept", "application/vnd.github+json")
              body = None
              if data is not None:
                  body = json.dumps(data).encode()
                  req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req, body, timeout=30) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.loads(e.read().decode())
                  except Exception:
                      return e.code, None
              except Exception as e:
                  return -1, None

          def write_file(path, content):
              b64 = base64.b64encode(content.encode()).decode()
              st, d = api(f"/repos/{REPO}/contents/{path}")
              sha = d.get("sha") if d else None
              p = {"message": "dl", "content": b64}
              if sha: p["sha"] = sha
              st2, _ = api(f"/repos/{REPO}/contents/{path}", "PUT", p)
              return st2 in (200, 201)

          URL = ("http://imtt2.dd.qq.com/sjy.00009/sjy.00002/16891/apk/"
                 "0F94B1CB324EE4F471C95BA1127CE377.apk"
                 "?fsname=com.tencent.tmgp.minitech.miniworld_80640.apk")

          out = []
          out.append("=== 1. 下载到 runner ===")
          t0 = time.time()
          r = subprocess.run(["curl","-sL","-m","600","-A","Mozilla/5.0","-o","/tmp/mw.apk",
                              "-w","%{http_code} %{size_download}", URL],
                             capture_output=True, text=True)
          out.append("curl: " + (r.stdout or "")[:200])
          sz = os.path.getsize("/tmp/mw.apk") if os.path.exists("/tmp/mw.apk") else 0
          out.append(f"size_bytes={sz}")
          out.append(f"size_mb={sz/1024/1024:.1f}")
          out.append(f"elapsed={time.time()-t0:.1f}s")
          out.append("=== 2. 文件类型 ===")
          r2 = subprocess.run(["file","/tmp/mw.apk"], capture_output=True, text=True)
          out.append((r2.stdout or "")[:300])
          out.append("=== 3. 解析版本 ===")
          r3 = subprocess.run(["python3","-c",
            "import zipfile;z=zipfile.ZipFile('/tmp/mw.apk');print(len(z.namelist()),'entries');print(z.namelist()[:6])"],
            capture_output=True, text=True)
          out.append((r3.stdout or "")[:400] + (r3.stderr or "")[:200])
          write_file("relay/result.txt", "\n".join(out))
          print("\n".join(out))
          PYEOF
          python3 relay/dl.py
