name: Fetch APK

on:
  workflow_dispatch:
    inputs:
      pat:
        description: 'PAT for upload repo'
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Fetch and shard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPLOAD_REPO: zhaoyi-habs/mw-apk-tmp
          PAT: ${{ github.event.inputs.pat }}
        run: |
          mkdir -p relay
          cat > relay/fetch.py <<'PYEOF'
          #!/usr/bin/env python3
          """下载 APK（多线程）-> 分片 -> 上传到临时仓库"""
          import os, sys, json, time, base64, subprocess, urllib.request, urllib.error

          TOKEN = os.environ.get("GH_TOKEN", "")
          PAT = os.environ.get("PAT", "")   # 运行时传入，不写进文件
          UP = os.environ.get("UPLOAD_REPO", "zhaoyi-habs/mw-apk-tmp")
          URL = ("http://imtt2.dd.qq.com/sjy.00009/sjy.00002/16891/apk/"
                 "0F94B1CB324EE4F471C95BA1127CE377.apk"
                 "?fsname=com.tencent.tmgp.minitech.miniworld_80640.apk")
          SRC = "/tmp/mw.apk"
          CHUNK = 40 * 1024 * 1024

          def sh(cmd, timeout=3600):
              return subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=timeout)

          def report(msg):
              b64 = base64.b64encode(msg.encode()).decode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ.get('GITHUB_REPOSITORY')}/contents/relay/result.txt")
              req.add_header("Authorization", "Bearer " + TOKEN)
              req.add_header("User-Agent", "r")
              sha = None
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      sha = json.loads(r.read().decode()).get("sha")
              except Exception:
                  pass
              p = {"message": "progress", "content": b64}
              if sha: p["sha"] = sha
              d = json.dumps(p).encode()
              req2 = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ.get('GITHUB_REPOSITORY')}/contents/relay/result.txt",
                  method="PUT")
              req2.add_header("Authorization", "Bearer " + TOKEN)
              req2.add_header("User-Agent", "r")
              req2.add_header("Content-Type", "application/json")
              try:
                  urllib.request.urlopen(req2, d, timeout=60).read()
              except Exception as e:
                  print("report fail", e)

          def main():
              out = []
              # 1. 装 aria2
              out.append("=== install aria2 ===")
              r = sh("apt-get install -y aria2 2>&1 | tail -2 || sudo apt-get install -y aria2 2>&1 | tail -2", 300)
              out.append((r.stdout or "")[-300:])
              report("\n".join(out))

              # 2. 多线程下载
              out.append("=== download (16 threads) ===")
              t0 = time.time()
              r = sh(f"aria2c -x 16 -s 16 -k 1M --timeout=600 --max-tries=5 "
                     f"-o mw.apk -d /tmp '{URL}' 2>&1 | tail -15", 9000)
              out.append((r.stdout or "")[-1500:])
              sz = os.path.getsize(SRC) if os.path.exists(SRC) else 0
              out.append(f"size={sz} ({sz/1048576:.1f}MB) elapsed={time.time()-t0:.0f}s")
              report("\n".join(out))
              if sz < 10 * 1024 * 1024:
                  out.append("下载过小，中止"); report("\n".join(out)); return 1

              # 3. 分片
              out.append("=== split ===")
              sh(f"rm -rf /tmp/parts && mkdir -p /tmp/parts && "
                 f"split -b {CHUNK} -d -a 3 {SRC} /tmp/parts/p")
              parts = sorted(os.listdir("/tmp/parts"))
              out.append(f"parts={len(parts)}: {parts[:3]} ... {parts[-1:]}")
              report("\n".join(out))

              # 4. 上传到临时仓库
              out.append("=== upload ===")
              sh(f"rm -rf /tmp/up && git clone --depth 1 "
                 f"https://x-access-token:{PAT}@github.com/{UP}.git /tmp/up", 300)
              sh("rm -rf /tmp/up/parts && mkdir -p /tmp/up/parts")
              sh("cp /tmp/parts/* /tmp/up/parts/")
              manifest = {"size": sz, "parts": len(parts), "chunk": CHUNK,
                          "name": "miniworld.apk"}
              open("/tmp/up/parts/manifest.json", "w").write(json.dumps(manifest))
              sh("cd /tmp/up && git config user.email a@b.c && git config user.name r && "
                 "git add -A && git commit -m 'shards' && git push origin HEAD:main 2>&1 | tail -5", 1800)
              out.append(f"uploaded {len(parts)} parts, total {sz/1048576:.1f}MB")
              out.append(f"elapsed_total={time.time()-t0:.0f}s")
              report("\n".join(out))
              print("\n".join(out))
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          python3 relay/fetch.py
