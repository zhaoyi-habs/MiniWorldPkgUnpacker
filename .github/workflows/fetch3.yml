name: Fetch3

on:
  workflow_dispatch:
    inputs:
      pat: {description: PAT, required: true}

permissions:
  contents: write

jobs:
  f:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Fetch upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAT: ${{ github.event.inputs.pat }}
        run: |
          mkdir -p relay
          cat > relay/fetch3.py <<'PYEOF'
          #!/usr/bin/env python3
          """下载 -> 校验 -> 用 gh CLI 上传（分块更稳）"""
          import os, sys, json, time, base64, subprocess, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed

          TOKEN = os.environ.get("GH_TOKEN", "")
          PAT = os.environ.get("PAT", "")
          STORE = os.environ.get("STORE", "zhaoyi-habs/mw-apk-store")
          TAG = os.environ.get("TAG", "mw-v1.59.0")
          REPO = os.environ.get("GITHUB_REPOSITORY", "")
          URL = ("https://imtt.dd.qq.com/sjy.00009/sjy.00002/16891/apk/"
                 "0F94B1CB324EE4F471C95BA1127CE377.apk"
                 "?fsname=com.tencent.tmgp.minitech.miniworld_80640.apk")
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
          SRC = "/tmp/mw.apk"; PDIR = "/tmp/parts"; NWORK = 24; NCHUNK = 48

          def report(msg):
              try:
                  path = f"/repos/{REPO}/contents/relay/result.txt"
                  req = urllib.request.Request("https://api.github.com" + path)
                  req.add_header("Authorization", "Bearer " + TOKEN); req.add_header("User-Agent","r")
                  sha=None
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          sha=json.loads(r.read().decode()).get("sha")
                  except Exception: pass
                  p={"message":"progress","content":base64.b64encode(msg.encode()).decode()}
                  if sha: p["sha"]=sha
                  r2=urllib.request.Request("https://api.github.com"+path, method="PUT")
                  r2.add_header("Authorization","Bearer "+TOKEN); r2.add_header("User-Agent","r")
                  r2.add_header("Content-Type","application/json")
                  urllib.request.urlopen(r2, json.dumps(p).encode(), timeout=90).read()
              except Exception as e: print("rep fail", e)

          def get_size():
              r = subprocess.run(["curl","-sI","-m","40","-A",UA,URL],capture_output=True,text=True)
              for l in (r.stdout or "").splitlines():
                  if l.lower().startswith("content-length:"): return int(l.split(":")[1].strip())
              return 0

          def cp(i): return os.path.join(PDIR,"p%03d"%i)

          def fetch(t):
              i,s,e=t; exp=e-s+1
              for a in range(6):
                  try: subprocess.run(["curl","-s","-m","900","-A",UA,"-r",f"{s}-{e}","-o",cp(i),URL],timeout=920)
                  except Exception: pass
                  if os.path.exists(cp(i)) and os.path.getsize(cp(i))==exp: return i,True
                  time.sleep(2*(a+1))
              return i,False

          out=[]
          os.makedirs(PDIR, exist_ok=True)
          size=get_size()
          out.append(f"size={size}"); report("\n".join(out))
          step=(size+NCHUNK-1)//NCHUNK
          tasks=[];pos=0;i=0
          while pos<size:
              e=min(pos+step-1,size-1); tasks.append((i,pos,e)); pos=e+1; i+=1
          t0=time.time(); fails=[]; n=0
          with ThreadPoolExecutor(max_workers=NWORK) as ex:
              fs=[ex.submit(fetch,t) for t in tasks]
              for f in as_completed(fs):
                  i,ok=f.result(); n+=1
                  if not ok: fails.append(i)
                  if n%12==0:
                      got=sum(os.path.getsize(cp(j)) for j,s,e in tasks if os.path.exists(cp(j)))
                      out.append(f"  {n}/{len(tasks)} {got*100//size}%")
                      report("\n".join(out))
          out.append(f"dl {len(tasks)-len(fails)}/{len(tasks)} in {(time.time()-t0)/60:.1f}min")
          report("\n".join(out))

          with open(SRC,"wb") as o:
              for j,s,e in tasks:
                  with open(cp(j),"rb") as f:
                      while True:
                          b=f.read(1<<20)
                          if not b: break
                          o.write(b)
          tot=os.path.getsize(SRC)
          out.append(f"merged={tot} match={tot==size}")
          import zipfile
          try:
              z=zipfile.ZipFile(SRC); out.append(f"zip OK {len(z.namelist())}")
          except Exception as e: out.append(f"zip FAIL {e}")
          report("\n".join(out))
          if tot!=size or fails:
              out.append("中止"); report("\n".join(out)); sys.exit(1)

          out.append("=== gh upload ===")
          env=dict(os.environ); env["GH_TOKEN"]=PAT
          t1=time.time()
          r=subprocess.run(["gh","release","upload",TAG,SRC,"--repo",STORE,"--clobber"],
                           capture_output=True,text=True,timeout=5400,env=env)
          out.append(f"rc={r.returncode} in {(time.time()-t1)/60:.1f}min")
          out.append("stdout: "+(r.stdout or "")[-500:])
          out.append("stderr: "+(r.stderr or "")[-500:])
          report("\n".join(out))

          if r.returncode!=0:
              out.append("=== 回退：分片上传 8x220MB ===")
              report("\n".join(out))
              subprocess.run("rm -rf /tmp/sp && mkdir -p /tmp/sp",shell=True)
              subprocess.run("split -b 220M -d -a 2 /tmp/mw.apk /tmp/sp/part",shell=True)
              parts=sorted(os.listdir("/tmp/sp"))
              for p in parts:
                  r2=subprocess.run(["gh","release","upload",TAG,f"/tmp/sp/{p}","--repo",STORE,"--clobber"],
                                    capture_output=True,text=True,timeout=3600,env=env)
                  out.append(f"  {p}: rc={r2.returncode}")
                  report("\n".join(out))
          out.append(f"TOTAL {(time.time()-t0)/60:.1f}min")
          report("\n".join(out))
          print("\n".join(out))
          PYEOF
          python3 relay/fetch3.py
