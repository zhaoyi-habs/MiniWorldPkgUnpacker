name: Relay Probe

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: 'command to run on runner (full network)'
        required: false
        default: 'echo RELAY_OK'
      topic:
        description: 'ntfy topic to publish results to'
        required: false
        default: 'minipanel-x7k9-2026'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Public IP and network capability
        run: |
          IP=""
          for s in ifconfig.me icanhazip.com api.ipify.org; do
            IP=$(curl -s -m 10 https://$s 2>/dev/null); [ -n "$IP" ] && break
          done
          echo "IPX=$IP" >> $GITHUB_ENV
          echo "IP=$IP"

      - name: Run command and publish to ntfy
        env:
          CMD: ${{ github.event.inputs.cmd }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          OUT=$(eval "$CMD" 2>&1 | head -c 2500)
          IPX="${IPX:-unknown}"
          MSG="RELAY RESULT
          ip=$IPX
          cmd=$CMD
          ---
          $OUT"
          echo "$MSG"
          # ntfy 不需要认证，runner 有完整网络，直接 POST
          curl -s -m 20 -X POST "https://ntfy.sh/$TOPIC" \
            -H "Title: relay-result" \
            -d "$MSG" -o /dev/null -w "  ntfy publish: %{http_code}\n"

      - name: Keep alive
        run: sleep 240
